{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl text-yellow-400 mb-4">⚡ Electrical Substations</h2>
<div class="space-y-3">
  {% for s in substations %}
    <div class="border border-gray-700 p-4 bg-gray-900">
      <p><strong>Sector:</strong> {{ s.sector.name }}</p>
      <p><strong>Voltage:</strong> {{ s.kv_voltage }} KV</p>
      <p><strong>Consupmtion:</strong> {{ s.kw_consupmtion }} KW</p>
      <p class="text-gray-500 text-sm">{{ s.timestamp }}</p>
    </div>
  {% endfor %}
</div>
<a href="/api/" class="block mt-6 text-blue-400 underline">← Return to the center panel</a>
{% endblock %}
