{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl text-blue-400 mb-4">💧 Water System</h2>
<div class="space-y-3">
  {% for d in data %}
    <div class="border border-gray-700 p-4 bg-gray-900">
      <p><strong>Sector:</strong> {{ d.sector.name }}</p>
      <p><strong>Flow:</strong> {{ d.flow_liters_per_min }} L/min</p>
      <p class="text-gray-500 text-sm">{{ d.timestamp }}</p>
    </div>
  {% endfor %}
</div>
<a href="/api/" class="block mt-6 text-blue-400 underline">← Return to the center panel</a>
{% endblock %}
