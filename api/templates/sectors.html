{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl text-green-400 mb-4">📍 Sectors</h2>
<ul class="space-y-2">
  {% for s in sectors %}
    <li class="bg-gray-800 p-3 border border-gray-700 rounded">{{ s.name }} ({{ s.code }})</li>
  {% empty %}
    <li class="text-gray-500">There are no registered sectors.</li>
  {% endfor %}
</ul>
<a href="/api/" class="block mt-6 text-blue-400 underline">← Return to the center panel</a>
{% endblock %}
